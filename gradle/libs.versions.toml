[versions]
agp = "8.11.1"
android_test = "1.6.2"
android_test_junit_ext = "1.2.1"
kotlin = "2.1.20"
core_ktx = "1.10.1"
junit = "4.13.2"
activity_compose = "1.8.0"
compose_plugin = '1.8.0'
koin = "4.0.4"
kotlin_coroutines = "1.10.2"
kotlin_datetime = "0.6.2"
kotlinx_serialization = "1.8.0"
ktor = "3.1.3"
multiplatform_settings = "1.3.0"
sqldelight = "2.1.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity_compose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core_ktx" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android_test" }
android-test-junit-ext = { module = "androidx.test.ext:junit", version.ref = "android_test_junit_ext" }
android-test-compose = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose_plugin" }
android-test-compose-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose_plugin" }
android-compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose_plugin" }
gradle-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-sqldelight = { module = "app.cash.sqldelight:gradle-plugin", version.ref = "sqldelight" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin_coroutines" }
kotlin-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlin_coroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlin_coroutines" }
kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlin_datetime" }
kotlin-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx_serialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }

multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform_settings" }
multiplatform-settings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "multiplatform_settings" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

[bundles]
instrumentedtest = ["android-test-runner", "android-test-junit-ext", "android-test-compose"]
unittest = ["kotlin-test", "kotlin-coroutines-test", "junit"]

[plugins]
compose = { id = "org.jetbrains.compose", version.ref = "compose_plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
